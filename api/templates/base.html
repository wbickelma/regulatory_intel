<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Regulatory Intelligence{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-shield-alt text-white text-2xl mr-3"></i>
                    <span class="text-white text-xl font-bold">Regulatory Intelligence</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/users" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                        {% if active_page == 'users' %}bg-white text-blue-900{% else %}text-white hover:bg-white/20{% endif %}">
                        <i class="fas fa-users mr-2"></i>Users
                    </a>
                    <a href="/topics" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                        {% if active_page == 'topics' %}bg-white text-blue-900{% else %}text-white hover:bg-white/20{% endif %}">
                        <i class="fas fa-tags mr-2"></i>Topics
                    </a>
                    <a href="/sources" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200
                        {% if active_page == 'sources' %}bg-white text-blue-900{% else %}text-white hover:bg-white/20{% endif %}">
                        <i class="fas fa-rss mr-2"></i>Sources
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            &copy; 2024 Regulatory Intelligence System
        </div>
    </footer>
</body>
</html>
